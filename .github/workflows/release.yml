name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # noinspection UndefinedAction
        uses: actions/checkout@v4
        with:
          # noinspection UndefinedParamsPresent
          fetch-depth: 0

      - name: Setup pnpm
        # noinspection UndefinedAction
        uses: pnpm/action-setup@v4
        with:
          # noinspection UndefinedParamsPresent
          version: 10.30.2

      - name: Setup Node
        # noinspection UndefinedAction
        uses: actions/setup-node@v4
        with:
          # noinspection UndefinedParamsPresent
          node-version: 24
          # noinspection UndefinedParamsPresent
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate
          pnpm install --frozen-lockfile

      - name: Install archive tools (Linux)
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Rust gateway tests
        run: cargo test --manifest-path rust/Cargo.toml -p gateway

      - name: Build standalone-service
        run: cargo build --manifest-path rust/Cargo.toml --release -p standalone-service

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Build publish artifacts
        run: pnpm run build:publish

      - name: Distribution smoke
        env:
          RUN_DISTRIBUTION_SMOKE: '1'
        run: node --experimental-strip-types --test --import ./tests/register-loader.mjs tests/format.test.ts

      - name: Read version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package deployment artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p artifacts/release

          bundle="artifacts/release/torrentmix-standalone-service-v${VERSION}-linux-amd64"
          mkdir -p "${bundle}/dist"
          cp rust/target/release/standalone-service "${bundle}/standalone-service"
          unzip -q "artifacts/publish/releases/${VERSION}/dist.zip" -d "${bundle}/dist"
          cp deploy/standalone-service/README.md "${bundle}/README.md"
          cp deploy/standalone-service/README.zh-CN.md "${bundle}/README.zh-CN.md"
          tar -czf \
            "artifacts/release/torrentmix-standalone-service-v${VERSION}-linux-amd64.tar.gz" \
            -C artifacts/release "torrentmix-standalone-service-v${VERSION}-linux-amd64"
          rm -rf "${bundle}"

      - name: Build Docker image archives
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          standalone_image="torrentmix-standalone-service:${VERSION}"
          sidecar_image="torrentmix-sidecar:${VERSION}"

          docker build --platform linux/amd64 -t "${standalone_image}" -f deploy/standalone-service/Dockerfile .
          docker build --platform linux/amd64 -t "${sidecar_image}" -f deploy/sidecar/Dockerfile .
          docker save "${standalone_image}" | gzip -n > \
            "artifacts/release/torrentmix-standalone-service-v${VERSION}-docker-linux-amd64.tar.gz"
          docker save "${sidecar_image}" | gzip -n > \
            "artifacts/release/torrentmix-sidecar-v${VERSION}-docker-linux-amd64.tar.gz"

          tar -tzf "artifacts/release/torrentmix-standalone-service-v${VERSION}-linux-amd64.tar.gz" >/dev/null
          gzip -t "artifacts/release/torrentmix-standalone-service-v${VERSION}-docker-linux-amd64.tar.gz"
          gzip -t "artifacts/release/torrentmix-sidecar-v${VERSION}-docker-linux-amd64.tar.gz"

      - name: Create GitHub Release
        # noinspection UndefinedAction
        uses: softprops/action-gh-release@v2
        with:
          # noinspection UndefinedParamsPresent
          generate_release_notes: true
          # noinspection UndefinedParamsPresent
          files: |
            artifacts/publish/manifest.json
            artifacts/publish/loader.html
            artifacts/publish/releases/${{ steps.meta.outputs.version }}/dist.zip
            artifacts/release/*
            deploy/sidecar/updater.mjs

      - name: Publish to gh-pages (latest.json + releases/)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p gh-pages
          cd gh-pages
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          git fetch origin gh-pages --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          mkdir -p releases
          rm -rf "releases/${VERSION}"
          cp -R "../artifacts/publish/releases/${VERSION}" "releases/${VERSION}"

          cp "../artifacts/publish/latest.json" "./latest.json"
          cp "../artifacts/publish/manifest.json" "./manifest.json"
          cp "../artifacts/publish/loader.html" "./loader.html"
          cp "../artifacts/publish/loader.html" "./index.html"

          touch .nojekyll

          git add -A
          git commit -m "chore: publish ${VERSION}" || echo "No changes to commit"
          git push origin gh-pages
